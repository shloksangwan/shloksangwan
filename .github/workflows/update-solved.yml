name: Update solved counts and GitHub stats

on:
  schedule:
    # 18:30 UTC is 12:00 AM in India (IST). GitHub can start scheduled runs a few minutes late.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch LeetCode, Codeforces and CodeChef counts
        run: python3 .github/scripts/update-solved.py assets/sb-leetcode.svg assets/sb-codeforces.svg assets/sb-codechef.svg assets/canvas-neon2.svg
      - name: Fetch public repos, contributions and the contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update-github-stats.py assets/canvas-neon2.svg
      - name: Commit if the counts changed
        run: |
          if git diff --quiet; then
            echo "Counts unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update solved counts and GitHub stats"
          git push
