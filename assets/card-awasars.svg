<style>
.r{fill:#4cc9f0;font-size:11px;animation:fall linear infinite}@keyframes fall{from{transform:translateY(-243px)}to{transform:translateY(270px)}}
.draw{stroke-dasharray:100;animation:draw 3.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
.dot{animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.65}50%{opacity:1}}
.eq{animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.ring{animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.8);opacity:.9}to{transform:scale(1.25);opacity:0}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.edge{stroke-dasharray:60 1340;animation:edge 6s linear infinite}
@keyframes edge{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
